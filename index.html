<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <!-- Enable standalone (full-screen) mode on iOS -->
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- Status bar color (default / black-translucent / black) -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- App name when added to home screen -->
<meta name="apple-mobile-web-app-title" content="句子重組遊戲">
<!-- Specify an icon for home-screen -->
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>句子重組遊戲</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f9f9f9; margin: 0; padding: 20px; }
    .dropdown { position: relative; min-width: 160px; max-width: 280px; margin-right: 16px; }
    .dropdown-toggle {
      padding: 8px 12px;
      background: #007BFF;
      color: #fff;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .dropdown-menu {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      min-width: 100%;
      max-height: 240px;
      overflow-y: auto;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 4px;
      display: none;
      z-index: 10;
    }
    .dropdown-item { padding: 8px; cursor: pointer; }
    .dropdown-item:hover { background: #f0f0f0; }
    #controls { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 0; margin-bottom: 16px; }
    #chars { border: 2px dashed #007BFF; padding: 12px; min-height: 60px; border-radius: 4px; display: flex; flex-wrap: wrap; gap: 8px; }
    #answer { border: 2px solid #28a745; padding: 12px; min-height: 60px; border-radius: 4px; background: #f1fdf4; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    #chars li, #answer li {
      list-style: none;
      padding: 16px 24px;
      background: #007BFF;
      color: #fff;
      border-radius: 4px;
      cursor: pointer;
      font-size: 200%;
    }
    #answer li.punct {
      background: transparent;
      color: #222;
      cursor: default;
      padding: 16px 8px;
      font-weight: 700;
    }
    #stars { font-size: 1.5rem; color: gold; margin: 16px 0; }
    #message { color: red; font-weight: bold; margin-top: 8px; }
    #pwdInput { margin-left: auto; padding: 8px; border: 1px solid #ccc; border-radius: 4px; width: 33%; min-width: 140px; }
    #pwdBtn { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
  </style>
</head>
<body>
  <div id="controls">
    <div id="mainDropdown" class="dropdown">
      <div id="mainToggle" class="dropdown-toggle">選擇分頁</div>
      <div id="mainMenu" class="dropdown-menu"></div>
    </div>
    <div id="subDropdown" class="dropdown">
      <div id="subToggle" class="dropdown-toggle">選擇課文</div>
      <div id="subMenu" class="dropdown-menu"></div>
    </div>
    <input type="password" id="pwdInput" placeholder="教師請輸入密碼" />
    <button id="pwdBtn">解鎖</button>
  </div>

  <button id="speakBtn">🔊 播放句子</button>
  <div id="stars">☆</div>
  <ul id="chars"></ul>
  <div id="answer"></div>
  <div id="message"></div>

  <script>
    const SHEET_ID = '1aVqFdHihHACMEmFScqDIoOzCIIFkXHHUleXvrLPm99Q';
    const SHEETS = [
      { name: '美洲一', gid: '0' },
      { name: '美洲二', gid: '779816915' }
    ];
    const bgColors = ['#007BFF', '#28a745', '#fd7e14', '#e83e8c', '#dc3545'];

    /** @type {{ title: string, sentences: string[] }[]} */
    let lessons = [];
    /** unlockedLessons[sheetIndex][lessonIndex] */
    let unlockedLessons = SHEETS.map(() => []);
    let bypass = false;
    let state = { m: 0, s: 0, q: 0, stars: [] };
    let menuClickBound = false;

    const pwdInput = document.getElementById('pwdInput');
    const pwdBtn = document.getElementById('pwdBtn');
    const mainToggle = document.getElementById('mainToggle');
    const mainMenu = document.getElementById('mainMenu');
    const subToggle = document.getElementById('subToggle');
    const subMenu = document.getElementById('subMenu');
    const speakBtn = document.getElementById('speakBtn');
    const charsEl = document.getElementById('chars');
    const answerEl = document.getElementById('answer');
    const starsEl = document.getElementById('stars');
    const messageEl = document.getElementById('message');

    function parseCSV(text) {
      const rows = [];
      let row = [];
      let cur = '';
      let inQuotes = false;
      const src = String(text || '').replace(/^\uFEFF/, '');
      for (let i = 0; i < src.length; i++) {
        const ch = src[i];
        if (inQuotes) {
          if (ch === '"') {
            if (src[i + 1] === '"') {
              cur += '"';
              i++;
            } else {
              inQuotes = false;
            }
          } else {
            cur += ch;
          }
        } else if (ch === '"') {
          inQuotes = true;
        } else if (ch === ',') {
          row.push(cur);
          cur = '';
        } else if (ch === '\n') {
          row.push(cur);
          rows.push(row);
          row = [];
          cur = '';
        } else if (ch === '\r') {
          // skip
        } else {
          cur += ch;
        }
      }
      if (cur.length || row.length) {
        row.push(cur);
        rows.push(row);
      }
      return rows;
    }

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function speak(text) {
      if (!('speechSynthesis' in window)) return;
      const voices = window.speechSynthesis.getVoices();
      const u = new SpeechSynthesisUtterance(text);
      const zhVoices = voices.filter(v => v.lang === 'zh-TW');
      let preferredVoice = zhVoices.find(
        v => v.name === '美佳 (zh-TW)' || v.name === 'Meijia (zh-TW)'
      );
      if (!preferredVoice && zhVoices.length > 0) {
        preferredVoice = zhVoices[zhVoices.length - 1];
      }
      if (preferredVoice) u.voice = preferredVoice;
      u.lang = 'zh-TW';
      u.rate = 0.75;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
    }

    function currentLesson() {
      return lessons[state.s] || { title: '', sentences: [] };
    }

    function ensureUnlockGrid() {
      while (unlockedLessons.length < SHEETS.length) unlockedLessons.push([]);
      for (let m = 0; m < SHEETS.length; m++) {
        if (!Array.isArray(unlockedLessons[m])) unlockedLessons[m] = [];
      }
    }

    function ensureLessonUnlocks(count) {
      ensureUnlockGrid();
      const row = unlockedLessons[state.m];
      while (row.length < count) row.push(false);
      if (row.length && !row.some(Boolean)) row[0] = true;
    }

    function resetStarsForLesson() {
      const n = currentLesson().sentences.length;
      state.stars = Array.from({ length: n }, (_, i) => !!(state.stars && state.stars[i]));
      while (state.stars.length < n) state.stars.push(false);
      if (state.stars.length > n) state.stars.length = n;
    }

    function renderStars() {
      const n = Math.max(1, currentLesson().sentences.length);
      if (!state.stars.length) state.stars = Array(n).fill(false);
      starsEl.textContent = state.stars.map(f => (f ? '★' : '☆')).join(' ');
    }

    function closeMenus() {
      mainMenu.style.display = 'none';
      subMenu.style.display = 'none';
    }

    function saveState() {
      localStorage.setItem(
        'unscrambleState_v2',
        JSON.stringify({ state, unlockedLessons, bypass })
      );
    }

    function loadSavedState() {
      const saved = localStorage.getItem('unscrambleState_v2');
      if (!saved) return;
      try {
        const obj = JSON.parse(saved);
        if (obj.state) state = Object.assign({ m: 0, s: 0, q: 0, stars: [] }, obj.state);
        if (Array.isArray(obj.unlockedLessons)) unlockedLessons = obj.unlockedLessons;
        if (obj.bypass) bypass = true;
      } catch (_) {}
      ensureUnlockGrid();
      if (state.m < 0 || state.m >= SHEETS.length) state.m = 0;
    }

    /** ?book=1&lesson=2 或 ?book=美洲一&lesson=2（lesson/unit 從 1 起算） */
    function parseDeepLink() {
      try {
        const p = new URLSearchParams(window.location.search);
        const bookRaw = (p.get('book') || p.get('sheet') || '').trim();
        const lessonRaw = p.get('lesson') || p.get('unit');
        if (!bookRaw && !lessonRaw) return null;

        let m = state.m;
        if (bookRaw) {
          const asNum = parseInt(bookRaw, 10);
          if (!isNaN(asNum) && String(asNum) === bookRaw && asNum >= 1 && asNum <= SHEETS.length) {
            m = asNum - 1;
          } else {
            const idx = SHEETS.findIndex((s) => s.name === bookRaw || s.gid === bookRaw);
            if (idx >= 0) m = idx;
            else return null;
          }
        }

        let s = null;
        if (lessonRaw != null && lessonRaw !== '') {
          const n = parseInt(lessonRaw, 10);
          if (isNaN(n) || n < 1) return null;
          s = n - 1;
        }
        return { m, s };
      } catch (_) {
        return null;
      }
    }

    function syncDeepLinkUrl() {
      try {
        const u = new URL(window.location.href);
        u.searchParams.set('book', String(state.m + 1));
        u.searchParams.set('lesson', String(state.s + 1));
        u.searchParams.delete('sheet');
        u.searchParams.delete('unit');
        const next = u.pathname + u.search + u.hash;
        if (next !== window.location.pathname + window.location.search + window.location.hash) {
          window.history.replaceState({}, '', next);
        }
      } catch (_) {}
    }

    function sheetCsvUrl(gid) {
      return (
        'https://docs.google.com/spreadsheets/d/' +
        encodeURIComponent(SHEET_ID) +
        '/export?format=csv&gid=' +
        encodeURIComponent(gid || '0')
      );
    }

    /** 欄 = 一課：第 1 列課名，第 2 列起句子 */
    function buildLessonsFromRows(rows) {
      if (!rows.length) return [];
      const colCount = rows.reduce((max, r) => Math.max(max, r.length), 0);
      const out = [];
      for (let c = 0; c < colCount; c++) {
        const title = String((rows[0] && rows[0][c]) || '').trim();
        const sentences = [];
        for (let r = 1; r < rows.length; r++) {
          const cell = String((rows[r] && rows[r][c]) || '').trim();
          if (cell) sentences.push(cell);
        }
        if (!title && !sentences.length) continue;
        out.push({
          title: title || ('課文 ' + (out.length + 1)),
          sentences
        });
      }
      return out;
    }

    async function loadSheet(sheetIndex, keepLessonIndex, opts) {
      const sheet = SHEETS[sheetIndex];
      if (!sheet) return;
      const forceLesson = !!(opts && opts.forceLesson);
      messageEl.textContent = '載入中…';
      messageEl.style.color = '#666';
      try {
        const resp = await fetch(sheetCsvUrl(sheet.gid), { cache: 'no-store' });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const text = await resp.text();
        const rows = parseCSV(text);
        lessons = buildLessonsFromRows(rows);
        ensureLessonUnlocks(lessons.length);

        state.m = sheetIndex;
        if (typeof keepLessonIndex === 'number' && keepLessonIndex >= 0 && keepLessonIndex < lessons.length) {
          state.s = keepLessonIndex;
        } else if (state.s >= lessons.length) {
          state.s = 0;
        }
        if (forceLesson) {
          unlockedLessons[state.m][state.s] = true;
          state.q = 0;
          state.stars = [];
        } else if (!bypass && !unlockedLessons[state.m][state.s]) {
          const firstOpen = unlockedLessons[state.m].findIndex(Boolean);
          state.s = firstOpen >= 0 ? firstOpen : 0;
          unlockedLessons[state.m][state.s] = true;
        }
        state.q = Math.min(state.q || 0, Math.max(0, currentLesson().sentences.length - 1));
        resetStarsForLesson();
        saveState();
        syncDeepLinkUrl();
        messageEl.textContent = '';
        messageEl.style.color = 'red';
        renderDropdowns();
        renderQuestion();
      } catch (e) {
        console.error(e);
        messageEl.style.color = 'red';
        messageEl.textContent = '試算表載入失敗：請確認已設為「知道連結的任何人可檢視」。';
        lessons = [];
        renderDropdowns();
      }
    }

    function renderDropdowns() {
      mainMenu.innerHTML = '';
      subMenu.innerHTML = '';

      SHEETS.forEach((sheet, i) => {
        const d = document.createElement('div');
        d.textContent = sheet.name;
        d.className = 'dropdown-item';
        d.style.background = bgColors[i % bgColors.length];
        d.style.color = '#fff';
        d.onclick = () => {
          state.m = i;
          state.s = 0;
          state.q = 0;
          state.stars = [];
          saveState();
          closeMenus();
          loadSheet(i, 0);
        };
        mainMenu.appendChild(d);
      });
      mainToggle.textContent = SHEETS[state.m] ? SHEETS[state.m].name : '選擇分頁';
      mainToggle.style.background = bgColors[state.m % bgColors.length];
      mainToggle.onclick = (e) => {
        e.stopPropagation();
        const open = mainMenu.style.display === 'block';
        closeMenus();
        mainMenu.style.display = open ? 'none' : 'block';
      };

      lessons.forEach((lesson, j) => {
        const d = document.createElement('div');
        d.textContent = lesson.title;
        d.className = 'dropdown-item';
        const locked = !bypass && !unlockedLessons[state.m][j];
        if (locked) {
          d.style.opacity = 0.45;
          d.style.pointerEvents = 'none';
        }
        d.onclick = () => {
          state.s = j;
          state.q = 0;
          unlockedLessons[state.m][state.s] = true;
          resetStarsForLesson();
          saveState();
          syncDeepLinkUrl();
          closeMenus();
          renderDropdowns();
          renderQuestion();
        };
        subMenu.appendChild(d);
      });
      subToggle.textContent = currentLesson().title || '選擇課文';
      subToggle.style.background = bgColors[state.m % bgColors.length];
      subToggle.onclick = (e) => {
        e.stopPropagation();
        const open = subMenu.style.display === 'block';
        closeMenus();
        subMenu.style.display = open ? 'none' : 'block';
      };

      if (!menuClickBound) {
        menuClickBound = true;
        document.addEventListener('click', (e) => {
          if (!e.target.closest('.dropdown')) closeMenus();
        });
      }
    }

    function isPunct(ch) {
      return /[，。！？、；：､,.!?;:“”‘’「」『』（）()【】《》〈〉…—～·\s]/.test(ch);
    }

    function splitSentence(sentence) {
      return Array.from(String(sentence || '')).map((ch) => ({
        type: isPunct(ch) ? 'punct' : 'char',
        ch
      }));
    }

    function charsOnly(parts) {
      return parts.filter((p) => p.type === 'char').map((p) => p.ch).join('');
    }

    function placedCharsFromAnswer() {
      return Array.from(answerEl.querySelectorAll('li.char')).map((el) => el.textContent);
    }

    function renderQuestion() {
      answerEl.innerHTML = '';
      messageEl.textContent = '';
      messageEl.style.color = 'red';
      charsEl.innerHTML = '';
      resetStarsForLesson();
      renderStars();

      const lesson = currentLesson();
      const sentence = lesson.sentences[state.q];
      if (!sentence) {
        messageEl.textContent = lesson.sentences.length
          ? '此課沒有更多句子。'
          : '此課沒有句子（請在試算表第 2 列起填入）。';
        speakBtn.onclick = null;
        return;
      }

      const parts = splitSentence(sentence);
      const expectedChars = charsOnly(parts);
      if (!expectedChars.length) {
        messageEl.textContent = '此句只有標點，沒有可重組的字。';
        speakBtn.onclick = () => speak(sentence);
        return;
      }

      function renderAnswerFromPlaced(placed) {
        answerEl.innerHTML = '';
        let pi = 0;
        let charsBefore = 0;
        for (const p of parts) {
          if (p.type === 'punct') {
            if (placed.length >= charsBefore && charsBefore > 0) {
              const li = document.createElement('li');
              li.className = 'punct';
              li.textContent = p.ch;
              answerEl.appendChild(li);
            }
          } else {
            if (pi < placed.length) {
              const li = document.createElement('li');
              li.className = 'char';
              li.textContent = placed[pi];
              const myIndex = pi;
              li.onclick = () => {
                const cur = placedCharsFromAnswer();
                const keep = cur.slice(0, myIndex);
                const removed = cur.slice(myIndex);
                removed.forEach((ch) => {
                  const back = document.createElement('li');
                  back.className = 'char';
                  back.textContent = ch;
                  back.onclick = pickChar;
                  charsEl.appendChild(back);
                });
                renderAnswerFromPlaced(keep);
              };
              answerEl.appendChild(li);
              pi += 1;
            }
            charsBefore += 1;
          }
        }
      }

      function pickChar(e) {
        const li = e.currentTarget;
        if (li.parentNode !== charsEl) return;
        const placed = placedCharsFromAnswer().concat([li.textContent]);
        li.remove();
        renderAnswerFromPlaced(placed);
        if (placed.length === expectedChars.length) checkAnswer(parts, expectedChars);
      }

      function returnAllCharsToPool() {
        const removed = placedCharsFromAnswer();
        answerEl.innerHTML = '';
        removed.forEach((ch) => {
          const back = document.createElement('li');
          back.className = 'char';
          back.textContent = ch;
          back.onclick = pickChar;
          charsEl.appendChild(back);
        });
      }

      // expose for wrong-answer reset
      renderQuestion._returnAllCharsToPool = returnAllCharsToPool;
      renderQuestion._pickChar = pickChar;

      shuffle(expectedChars.split('')).forEach((ch) => {
        const li = document.createElement('li');
        li.className = 'char';
        li.textContent = ch;
        li.onclick = pickChar;
        charsEl.appendChild(li);
      });

      speakBtn.onclick = () => speak(sentence);
      speak(sentence);
    }

    function checkAnswer(parts, expectedChars) {
      const lesson = currentLesson();
      const sentence = lesson.sentences[state.q];
      if (!sentence) return;
      const expected = expectedChars || charsOnly(splitSentence(sentence));
      const ans = placedCharsFromAnswer().join('');
      if (ans === expected) {
        answerEl.innerHTML = '';
        (parts || splitSentence(sentence)).forEach((p) => {
          const li = document.createElement('li');
          li.className = p.type === 'punct' ? 'punct' : 'char';
          li.textContent = p.ch;
          answerEl.appendChild(li);
        });
        messageEl.style.color = 'green';
        messageEl.textContent = '恭喜正確！';
        state.stars[state.q] = true;
        const lastQ = lesson.sentences.length - 1;
        if (state.q === lastQ && !bypass) {
          if (state.s + 1 < lessons.length) unlockedLessons[state.m][state.s + 1] = true;
        }
        saveState();
        renderStars();
        setTimeout(() => {
          messageEl.textContent = '';
          if (state.q < lastQ) {
            state.q++;
          } else {
            state.q = 0;
            state.stars = [];
            if (state.s + 1 < lessons.length) {
              state.s++;
              unlockedLessons[state.m][state.s] = true;
            }
            resetStarsForLesson();
          }
          saveState();
          syncDeepLinkUrl();
          closeMenus();
          renderDropdowns();
          renderQuestion();
        }, 2000);
      } else {
        messageEl.style.color = 'red';
        messageEl.textContent = '❌ 錯誤，請再試一次';
        if (typeof renderQuestion._returnAllCharsToPool === 'function') {
          renderQuestion._returnAllCharsToPool();
        } else {
          Array.from(answerEl.querySelectorAll('li.char')).forEach((li) => {
            const back = document.createElement('li');
            back.className = 'char';
            back.textContent = li.textContent;
            back.onclick = renderQuestion._pickChar;
            charsEl.appendChild(back);
          });
          answerEl.innerHTML = '';
        }
      }
    }

    pwdBtn.onclick = () => {
      if (pwdInput.value === 'CREC') {
        bypass = true;
        ensureUnlockGrid();
        unlockedLessons = unlockedLessons.map((row, m) => {
          const n = m === state.m ? Math.max(row.length, lessons.length, 1) : Math.max(row.length, 1);
          return Array.from({ length: n }, () => true);
        });
        saveState();
        renderDropdowns();
        renderQuestion();
      } else {
        alert('密碼錯誤');
      }
      pwdInput.value = '';
    };

    window.addEventListener('DOMContentLoaded', () => {
      loadSavedState();
      const deep = parseDeepLink();
      if (deep) {
        state.m = deep.m;
        if (deep.s != null) state.s = deep.s;
        loadSheet(state.m, state.s, { forceLesson: deep.s != null });
      } else {
        loadSheet(state.m, state.s);
      }
    });
  </script>
</body>
</html>
