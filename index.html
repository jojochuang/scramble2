<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <!-- Enable standalone (full-screen) mode on iOS -->
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- Status bar color (default / black-translucent / black) -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- App name when added to home screen -->
<meta name="apple-mobile-web-app-title" content="句子重組遊戲">
<!-- Specify an icon for home-screen -->
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>句子重組遊戲</title>
  <style>
    @font-face {
      font-family: 'TW-Kai-98';
      src: url('TW-Kai-98_1.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft JhengHei', '微軟正黑體', Arial, sans-serif;
      background: #f9f9f9;
      margin: 0;
      padding: 20px;
    }
    .dropdown { position: relative; min-width: 160px; max-width: 280px; margin-right: 16px; }
    .dropdown-toggle {
      padding: 8px 12px;
      background: #007BFF;
      color: #fff;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .dropdown-menu {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      min-width: 100%;
      max-height: 240px;
      overflow-y: auto;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 4px;
      display: none;
      z-index: 10;
    }
    .dropdown-item { padding: 8px; cursor: pointer; }
    .dropdown-item:hover { background: #f0f0f0; }
    #controls { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 0; margin-bottom: 16px; }
    #stars {
      font-size: 1.5rem;
      color: gold;
      margin: 0 12px 0 4px;
      white-space: nowrap;
      letter-spacing: 0.08em;
      line-height: 1;
    }
    #chars {
      border: 2px dashed #007BFF;
      padding: 20px;
      min-height: 22vh;
      border-radius: 8px;
      display: grid;
      grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr));
      gap: 14px 16px;
      justify-items: stretch;
      align-content: center;
      margin: 12px 0;
    }
    #answer {
      border: 2px solid #28a745;
      padding: 16px;
      min-height: 80px;
      border-radius: 8px;
      background: #f1fdf4;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
      justify-content: center;
    }
    #chars li, #answer li {
      list-style: none;
      padding: 0.3em 0.45em;
      background: #007BFF;
      color: #fff;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      line-height: 1.15;
      font-family: 'TW-Kai-98', 'BiauKai', 'DFKai-SB', '標楷體', 'KaiTi', '楷體', serif;
      font-weight: normal;
      user-select: none;
    }
    #chars li {
      position: relative;
      font-size: clamp(2.8rem, 6.2vw, 5.5rem);
      min-height: 1.35em;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: visible;
    }
    #chars li .glyph {
      display: inline-block;
      transform: scale(1.5);
      transform-origin: center center;
      line-height: 1;
    }
    #chars li .num {
      position: absolute;
      top: 0.2em;
      left: 0.28em;
      font-size: clamp(0.85rem, 1.6vw, 1.25rem);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft JhengHei', sans-serif;
      font-weight: 700;
      line-height: 1;
      opacity: 0.95;
      pointer-events: none;
      transform: scale(2.25);
      transform-origin: top left;
    }
    #answer li {
      font-size: clamp(2rem, 4.2vw, 3.6rem);
      padding: 0.35em 0.5em;
      overflow: visible;
    }
    #answer li .glyph {
      display: inline-block;
      transform: scale(1.5);
      transform-origin: center center;
      line-height: 1;
    }
    #answer li.punct {
      background: transparent;
      color: #222;
      cursor: default;
      padding: 0.35em 0.2em;
      font-weight: 700;
    }
    #message { color: red; font-weight: bold; margin-top: 8px; }
    #pwdInput { margin-left: auto; padding: 8px; border: 1px solid #ccc; border-radius: 4px; width: 33%; min-width: 140px; }
    #pwdBtn { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    #speakBtn { margin-bottom: 8px; }
    #fsBtn {
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
      white-space: nowrap;
    }

    /* 小螢幕：功能列放到下方（隨頁面捲動，不固定） */
    @media (max-width: 768px), ((hover: none) and (pointer: coarse) and (max-width: 1024px)) {
      body {
        display: flex;
        flex-direction: column;
        padding: 12px;
        box-sizing: border-box;
      }
      #gameMain { order: 1; }
      #chrome {
        order: 2;
        margin-top: 16px;
        padding-top: 12px;
        border-top: 1px solid #ddd;
      }
      #controls {
        margin-bottom: 8px;
        gap: 8px;
      }
      .dropdown {
        min-width: 0;
        flex: 1 1 40%;
        max-width: none;
        margin-right: 0;
      }
      #stars { margin: 0; flex: 0 0 auto; }
      #pwdInput {
        margin-left: 0;
        width: auto;
        min-width: 0;
        flex: 1 1 120px;
      }
      #speakBtn, #fsBtn {
        width: 100%;
        margin-bottom: 8px;
        padding: 10px;
        font-size: 1.05rem;
      }
      #fsBtn { margin-bottom: 0; }
      .dropdown-menu {
        top: auto;
        bottom: 100%;
        max-height: min(40vh, 240px);
      }
      #chars {
        min-height: 18vh;
        margin-top: 0;
        padding: 12px;
      }
    }

    /* 答對讚手勢（參考 typo correct） */
    .feedback-fx {
      position: fixed;
      left: 50%;
      top: 40%;
      z-index: 80;
      transform: translate(-50%, -50%);
      font-size: clamp(4.5rem, 22vw, 8rem);
      line-height: 1;
      pointer-events: none;
      text-shadow: 0 0.08em 0.2em rgba(0, 0, 0, 0.35);
      animation: feedback-thumb-pop 0.5s ease-out;
    }
    .feedback-fx.hidden { display: none; }
    .feedback-fx--ok {
      filter: drop-shadow(0 0 0.2em rgba(46, 125, 50, 0.9));
    }
    @keyframes feedback-thumb-pop {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
      55% { transform: translate(-50%, -50%) scale(1.12); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }

    /* 整課完成橫幅 */
    .lesson-complete {
      position: fixed;
      inset: 0;
      z-index: 90;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5%;
      background: rgba(0, 0, 0, 0.45);
      pointer-events: auto;
    }
    .lesson-complete.hidden { display: none; }
    .lesson-complete__panel {
      width: min(94%, 28em);
      text-align: center;
    }
    .lesson-complete__banner {
      margin: 0;
      padding: 0.75em 0.6em;
      font-size: clamp(2rem, 9vw, 3.4rem);
      font-weight: 800;
      line-height: 1.2;
      color: #fff8e1;
      text-shadow:
        0 0 0.35em rgba(255, 193, 7, 0.9),
        0 2px 8px rgba(0, 0, 0, 0.55);
      background: linear-gradient(135deg, rgba(255, 152, 0, 0.92) 0%, rgba(245, 124, 0, 0.95) 45%, rgba(230, 81, 0, 0.92) 100%);
      border-radius: 0.35em;
      box-shadow: 0 0.25em 1em rgba(0, 0, 0, 0.35);
      animation: lesson-complete-pop 0.55s ease-out;
    }
    .lesson-complete__sub {
      margin: 0.85em 0 0;
      color: #fff;
      font-size: clamp(1.1rem, 4vw, 1.5rem);
      font-weight: 700;
      text-shadow: 0 1px 4px rgba(0,0,0,0.45);
    }
    @keyframes lesson-complete-pop {
      0% { opacity: 0; transform: scale(0.85) translateY(0.5em); }
      70% { transform: scale(1.04) translateY(0); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
  </style>
</head>
<body>
  <div id="chrome">
    <div id="controls">
      <div id="mainDropdown" class="dropdown">
        <div id="mainToggle" class="dropdown-toggle">選擇分頁</div>
        <div id="mainMenu" class="dropdown-menu"></div>
      </div>
      <div id="subDropdown" class="dropdown">
        <div id="subToggle" class="dropdown-toggle">選擇課文</div>
        <div id="subMenu" class="dropdown-menu"></div>
      </div>
      <div id="stars">☆</div>
      <input type="password" id="pwdInput" placeholder="教師請輸入密碼" />
      <button id="pwdBtn">解鎖</button>
    </div>
    <button id="speakBtn">🔊 播放句子</button>
    <button type="button" id="fsBtn">進入全螢幕</button>
  </div>

  <div id="gameMain">
    <ul id="chars"></ul>
    <div id="answer"></div>
    <div id="message"></div>
  </div>


  <div id="feedbackFx" class="feedback-fx hidden" aria-hidden="true"></div>
  <div id="lessonCompleteOverlay" class="lesson-complete hidden" role="dialog" aria-labelledby="lessonCompleteTitle">
    <div class="lesson-complete__panel">
      <p id="lessonCompleteTitle" class="lesson-complete__banner">You did it!</p>
      <p class="lesson-complete__sub">你做到了！</p>
    </div>
  </div>

  <script>

    const SHEET_ID = '1aVqFdHihHACMEmFScqDIoOzCIIFkXHHUleXvrLPm99Q';
    const SHEETS = [
      { name: '美洲一', gid: '0' },
      { name: '美洲二', gid: '779816915' }
    ];
    const bgColors = ['#007BFF', '#28a745', '#fd7e14', '#e83e8c', '#dc3545'];

    /** @type {{ title: string, sentences: string[] }[]} */
    let lessons = [];
    /** unlockedLessons[sheetIndex][lessonIndex] */
    let unlockedLessons = SHEETS.map(() => []);
    let bypass = false;
    let state = { m: 0, s: 0, q: 0, stars: [] };
    let menuClickBound = false;

    const pwdInput = document.getElementById('pwdInput');
    const pwdBtn = document.getElementById('pwdBtn');
    const mainToggle = document.getElementById('mainToggle');
    const mainMenu = document.getElementById('mainMenu');
    const subToggle = document.getElementById('subToggle');
    const subMenu = document.getElementById('subMenu');
    const speakBtn = document.getElementById('speakBtn');
    const charsEl = document.getElementById('chars');
    const answerEl = document.getElementById('answer');
    const starsEl = document.getElementById('stars');
    const messageEl = document.getElementById('message');
    const fsBtn = document.getElementById('fsBtn');

    function parseCSV(text) {
      const rows = [];
      let row = [];
      let cur = '';
      let inQuotes = false;
      const src = String(text || '').replace(/^\uFEFF/, '');
      for (let i = 0; i < src.length; i++) {
        const ch = src[i];
        if (inQuotes) {
          if (ch === '"') {
            if (src[i + 1] === '"') {
              cur += '"';
              i++;
            } else {
              inQuotes = false;
            }
          } else {
            cur += ch;
          }
        } else if (ch === '"') {
          inQuotes = true;
        } else if (ch === ',') {
          row.push(cur);
          cur = '';
        } else if (ch === '\n') {
          row.push(cur);
          rows.push(row);
          row = [];
          cur = '';
        } else if (ch === '\r') {
          // skip
        } else {
          cur += ch;
        }
      }
      if (cur.length || row.length) {
        row.push(cur);
        rows.push(row);
      }
      return rows;
    }

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function speak(text) {
      if (!('speechSynthesis' in window)) return;
      const voices = window.speechSynthesis.getVoices();
      const u = new SpeechSynthesisUtterance(text);
      const zhVoices = voices.filter(v => v.lang === 'zh-TW');
      let preferredVoice = zhVoices.find(
        v => v.name === '美佳 (zh-TW)' || v.name === 'Meijia (zh-TW)'
      );
      if (!preferredVoice && zhVoices.length > 0) {
        preferredVoice = zhVoices[zhVoices.length - 1];
      }
      if (preferredVoice) u.voice = preferredVoice;
      u.lang = 'zh-TW';
      u.rate = 0.75;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
    }

    function currentLesson() {
      return lessons[state.s] || { title: '', sentences: [] };
    }

    function ensureUnlockGrid() {
      while (unlockedLessons.length < SHEETS.length) unlockedLessons.push([]);
      for (let m = 0; m < SHEETS.length; m++) {
        if (!Array.isArray(unlockedLessons[m])) unlockedLessons[m] = [];
      }
    }

    function ensureLessonUnlocks(count) {
      ensureUnlockGrid();
      const row = unlockedLessons[state.m];
      while (row.length < count) row.push(false);
      if (row.length && !row.some(Boolean)) row[0] = true;
    }

    function resetStarsForLesson() {
      const n = currentLesson().sentences.length;
      state.stars = Array.from({ length: n }, (_, i) => !!(state.stars && state.stars[i]));
      while (state.stars.length < n) state.stars.push(false);
      if (state.stars.length > n) state.stars.length = n;
    }

    function renderStars() {
      const n = Math.max(1, currentLesson().sentences.length);
      if (!state.stars.length) state.stars = Array(n).fill(false);
      starsEl.textContent = state.stars.map(f => (f ? '★' : '☆')).join(' ');
    }

    function closeMenus() {
      mainMenu.style.display = 'none';
      subMenu.style.display = 'none';
    }

    function saveState() {
      localStorage.setItem(
        'unscrambleState_v2',
        JSON.stringify({ state, unlockedLessons, bypass })
      );
    }

    function loadSavedState() {
      const saved = localStorage.getItem('unscrambleState_v2');
      if (!saved) return;
      try {
        const obj = JSON.parse(saved);
        if (obj.state) state = Object.assign({ m: 0, s: 0, q: 0, stars: [] }, obj.state);
        if (Array.isArray(obj.unlockedLessons)) unlockedLessons = obj.unlockedLessons;
        if (obj.bypass) bypass = true;
      } catch (_) {}
      ensureUnlockGrid();
      if (state.m < 0 || state.m >= SHEETS.length) state.m = 0;
    }

    /** ?book=1&lesson=2 或 ?book=美洲一&lesson=2（lesson/unit 從 1 起算） */
    function parseDeepLink() {
      try {
        const p = new URLSearchParams(window.location.search);
        const bookRaw = (p.get('book') || p.get('sheet') || '').trim();
        const lessonRaw = p.get('lesson') || p.get('unit');
        if (!bookRaw && !lessonRaw) return null;

        let m = state.m;
        if (bookRaw) {
          const asNum = parseInt(bookRaw, 10);
          if (!isNaN(asNum) && String(asNum) === bookRaw && asNum >= 1 && asNum <= SHEETS.length) {
            m = asNum - 1;
          } else {
            const idx = SHEETS.findIndex((s) => s.name === bookRaw || s.gid === bookRaw);
            if (idx >= 0) m = idx;
            else return null;
          }
        }

        let s = null;
        if (lessonRaw != null && lessonRaw !== '') {
          const n = parseInt(lessonRaw, 10);
          if (isNaN(n) || n < 1) return null;
          s = n - 1;
        }
        return { m, s };
      } catch (_) {
        return null;
      }
    }

    function syncDeepLinkUrl() {
      try {
        const u = new URL(window.location.href);
        u.searchParams.set('book', String(state.m + 1));
        u.searchParams.set('lesson', String(state.s + 1));
        u.searchParams.delete('sheet');
        u.searchParams.delete('unit');
        const next = u.pathname + u.search + u.hash;
        if (next !== window.location.pathname + window.location.search + window.location.hash) {
          window.history.replaceState({}, '', next);
        }
      } catch (_) {}
    }

    function sheetCsvUrl(gid) {
      return (
        'https://docs.google.com/spreadsheets/d/' +
        encodeURIComponent(SHEET_ID) +
        '/export?format=csv&gid=' +
        encodeURIComponent(gid || '0')
      );
    }

    /** 欄 = 一課：第 1 列課名，第 2 列起句子 */
    function buildLessonsFromRows(rows) {
      if (!rows.length) return [];
      const colCount = rows.reduce((max, r) => Math.max(max, r.length), 0);
      const out = [];
      for (let c = 0; c < colCount; c++) {
        const title = String((rows[0] && rows[0][c]) || '').trim();
        const sentences = [];
        for (let r = 1; r < rows.length; r++) {
          const cell = String((rows[r] && rows[r][c]) || '').trim();
          if (cell) sentences.push(cell);
        }
        if (!title && !sentences.length) continue;
        out.push({
          title: title || ('課文 ' + (out.length + 1)),
          sentences
        });
      }
      return out;
    }

    async function loadSheet(sheetIndex, keepLessonIndex, opts) {
      const sheet = SHEETS[sheetIndex];
      if (!sheet) return;
      const forceLesson = !!(opts && opts.forceLesson);
      messageEl.textContent = '載入中…';
      messageEl.style.color = '#666';
      try {
        const resp = await fetch(sheetCsvUrl(sheet.gid), { cache: 'no-store' });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const text = await resp.text();
        const rows = parseCSV(text);
        lessons = buildLessonsFromRows(rows);
        ensureLessonUnlocks(lessons.length);

        state.m = sheetIndex;
        if (typeof keepLessonIndex === 'number' && keepLessonIndex >= 0 && keepLessonIndex < lessons.length) {
          state.s = keepLessonIndex;
        } else if (state.s >= lessons.length) {
          state.s = 0;
        }
        if (forceLesson) {
          unlockedLessons[state.m][state.s] = true;
          state.q = 0;
          state.stars = [];
        } else if (!bypass && !unlockedLessons[state.m][state.s]) {
          const firstOpen = unlockedLessons[state.m].findIndex(Boolean);
          state.s = firstOpen >= 0 ? firstOpen : 0;
          unlockedLessons[state.m][state.s] = true;
        }
        state.q = Math.min(state.q || 0, Math.max(0, currentLesson().sentences.length - 1));
        resetStarsForLesson();
        saveState();
        syncDeepLinkUrl();
        messageEl.textContent = '';
        messageEl.style.color = 'red';
        renderDropdowns();
        renderQuestion();
      } catch (e) {
        console.error(e);
        messageEl.style.color = 'red';
        messageEl.textContent = '試算表載入失敗：請確認已設為「知道連結的任何人可檢視」。';
        lessons = [];
        renderDropdowns();
      }
    }

    function renderDropdowns() {
      mainMenu.innerHTML = '';
      subMenu.innerHTML = '';

      SHEETS.forEach((sheet, i) => {
        const d = document.createElement('div');
        d.textContent = sheet.name;
        d.className = 'dropdown-item';
        d.style.background = bgColors[i % bgColors.length];
        d.style.color = '#fff';
        d.onclick = () => {
          state.m = i;
          state.s = 0;
          state.q = 0;
          state.stars = [];
          saveState();
          closeMenus();
          loadSheet(i, 0);
        };
        mainMenu.appendChild(d);
      });
      mainToggle.textContent = SHEETS[state.m] ? SHEETS[state.m].name : '選擇分頁';
      mainToggle.style.background = bgColors[state.m % bgColors.length];
      mainToggle.onclick = (e) => {
        e.stopPropagation();
        const open = mainMenu.style.display === 'block';
        closeMenus();
        mainMenu.style.display = open ? 'none' : 'block';
      };

      lessons.forEach((lesson, j) => {
        const d = document.createElement('div');
        d.textContent = lesson.title;
        d.className = 'dropdown-item';
        const locked = !bypass && !unlockedLessons[state.m][j];
        if (locked) {
          d.style.opacity = 0.45;
          d.style.pointerEvents = 'none';
        }
        d.onclick = () => {
          state.s = j;
          state.q = 0;
          unlockedLessons[state.m][state.s] = true;
          resetStarsForLesson();
          saveState();
          syncDeepLinkUrl();
          closeMenus();
          renderDropdowns();
          renderQuestion();
        };
        subMenu.appendChild(d);
      });
      subToggle.textContent = currentLesson().title || '選擇課文';
      subToggle.style.background = bgColors[state.m % bgColors.length];
      subToggle.onclick = (e) => {
        e.stopPropagation();
        const open = subMenu.style.display === 'block';
        closeMenus();
        subMenu.style.display = open ? 'none' : 'block';
      };

      if (!menuClickBound) {
        menuClickBound = true;
        document.addEventListener('click', (e) => {
          if (!e.target.closest('.dropdown')) closeMenus();
        });
      }
    }

    function isVariationSelector(ch) {
      const cp = ch.codePointAt(0);
      // VS1–VS16 + IVS (VS17–VS256)
      return (cp >= 0xfe00 && cp <= 0xfe0f) || (cp >= 0xe0100 && cp <= 0xe01ef);
    }

    function isPunct(ch) {
      return /[，。！？、；：､,.!?;:“”‘’「」『』（）()【】《》〈〉…—～·\s]/.test(ch);
    }

    /** 拆句：標點不當字庫；異體／破音用的 Variation Selector 併入前一字 */
    function splitSentence(sentence) {
      const out = [];
      for (const ch of String(sentence || '')) {
        if (isVariationSelector(ch)) {
          if (out.length) out[out.length - 1].ch += ch;
          continue;
        }
        // 零寬／格式字元略過，避免空按鈕
        const cp = ch.codePointAt(0);
        if (
          cp === 0xfeff ||
          cp === 0x200b ||
          cp === 0x200c ||
          cp === 0x200d ||
          cp === 0x2060
        ) {
          continue;
        }
        out.push({
          type: isPunct(ch) ? 'punct' : 'char',
          ch
        });
      }
      return out.filter((p) => p.type === 'punct' || p.ch.replace(/\s/g, '').length > 0);
    }

    function charsOnly(parts) {
      return parts.filter((p) => p.type === 'char').map((p) => p.ch).join('');
    }

    function placedCharsFromAnswer() {
      return Array.from(answerEl.querySelectorAll('li.char')).map(
        (el) => el.dataset.ch || el.textContent
      );
    }

    function placedTilesFromAnswer() {
      return Array.from(answerEl.querySelectorAll('li.char')).map((el) => ({
        ch: el.dataset.ch || el.textContent,
        num: el.dataset.num || ''
      }));
    }

    function makePoolTile(ch, num, onClick) {
      const li = document.createElement('li');
      li.className = 'char';
      li.dataset.ch = ch;
      li.dataset.num = String(num);
      const badge = document.createElement('span');
      badge.className = 'num';
      badge.textContent = String(num);
      const glyph = document.createElement('span');
      glyph.className = 'glyph';
      glyph.textContent = ch;
      li.appendChild(badge);
      li.appendChild(glyph);
      li.onclick = onClick;
      return li;
    }

    function fillCharTile(li, ch) {
      li.textContent = '';
      const glyph = document.createElement('span');
      glyph.className = 'glyph';
      glyph.textContent = ch;
      li.appendChild(glyph);
    }

    function setCharGridCols(n) {
      const landscape = window.matchMedia('(orientation: landscape)').matches;
      let cols;
      if (landscape) {
        cols = Math.min(4, Math.max(1, n));
      } else {
        // 直式：一列最多 3 個字
        cols = Math.min(3, Math.max(1, n));
      }
      charsEl.style.setProperty('--cols', String(cols));
    }

    function isFullscreen() {
      return !!(
        document.fullscreenElement ||
        document.webkitFullscreenElement ||
        document.msFullscreenElement
      );
    }

    function updateFsBtn() {
      if (!fsBtn) return;
      fsBtn.textContent = isFullscreen() ? '退出全螢幕' : '進入全螢幕';
    }

    async function toggleFullscreen() {
      try {
        if (isFullscreen()) {
          if (document.exitFullscreen) await document.exitFullscreen();
          else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
          else if (document.msExitFullscreen) document.msExitFullscreen();
        } else {
          const el = document.documentElement;
          if (el.requestFullscreen) await el.requestFullscreen();
          else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
          else if (el.msRequestFullscreen) el.msRequestFullscreen();
          else {
            alert('此瀏覽器不支援全螢幕，請用系統「加入主畫面」或旋轉成橫式。');
            return;
          }
        }
      } catch (e) {
        console.warn(e);
        alert('無法切換全螢幕，請確認瀏覽器權限。');
      }
      updateFsBtn();
    }

    function renderQuestion() {
      answerEl.innerHTML = '';
      messageEl.textContent = '';
      messageEl.style.color = 'red';
      charsEl.innerHTML = '';
      resetStarsForLesson();
      renderStars();

      const lesson = currentLesson();
      const sentence = lesson.sentences[state.q];
      if (!sentence) {
        messageEl.textContent = lesson.sentences.length
          ? '此課沒有更多句子。'
          : '此課沒有句子（請在試算表第 2 列起填入）。';
        speakBtn.onclick = null;
        return;
      }

      const parts = splitSentence(sentence);
      const charList = parts.filter((p) => p.type === 'char').map((p) => p.ch);
      const expectedChars = charList.join('');
      if (!charList.length) {
        messageEl.textContent = '此句只有標點，沒有可重組的字。';
        speakBtn.onclick = () => speak(sentence);
        return;
      }

      function renderAnswerFromPlaced(placed) {
        answerEl.innerHTML = '';
        let pi = 0;
        let charsBefore = 0;
        for (const p of parts) {
          if (p.type === 'punct') {
            if (placed.length >= charsBefore && charsBefore > 0) {
              const li = document.createElement('li');
              li.className = 'punct';
              li.textContent = p.ch;
              answerEl.appendChild(li);
            }
          } else {
            if (pi < placed.length) {
              const tile = placed[pi];
              const li = document.createElement('li');
              li.className = 'char';
              li.dataset.ch = tile.ch;
              if (tile.num) li.dataset.num = String(tile.num);
              fillCharTile(li, tile.ch);
              const myIndex = pi;
              li.onclick = () => {
                const cur = placedTilesFromAnswer();
                const keep = cur.slice(0, myIndex);
                const removed = cur.slice(myIndex);
                removed.forEach((item) => {
                  charsEl.appendChild(makePoolTile(item.ch, item.num || '?', pickChar));
                });
                renderAnswerFromPlaced(keep);
              };
              answerEl.appendChild(li);
              pi += 1;
            }
            charsBefore += 1;
          }
        }
      }

      function pickChar(e) {
        const li = e.currentTarget;
        if (li.parentNode !== charsEl) return;
        const tile = { ch: li.dataset.ch || '', num: li.dataset.num || '' };
        const placed = placedTilesFromAnswer().concat([tile]);
        li.remove();
        renderAnswerFromPlaced(placed);
        if (placed.length === charList.length) checkAnswer(parts, expectedChars);
      }

      function returnAllCharsToPool() {
        const removed = placedTilesFromAnswer();
        answerEl.innerHTML = '';
        removed.forEach((item) => {
          charsEl.appendChild(makePoolTile(item.ch, item.num || '?', pickChar));
        });
      }

      // expose for wrong-answer reset
      renderQuestion._returnAllCharsToPool = returnAllCharsToPool;
      renderQuestion._pickChar = pickChar;

      // 不可用 split('')：破音／異體 Variation Selector 會被拆成空白按鈕
      shuffle(charList.slice()).forEach((ch, i) => {
        charsEl.appendChild(makePoolTile(ch, i + 1, pickChar));
      });

      setCharGridCols(charList.length);

      speakBtn.onclick = () => speak(sentence);
      speak(sentence);
    }

    let feedbackFxTimer = null;
    let advanceTimer = null;

    function showThumbsUp() {
      const el = document.getElementById('feedbackFx');
      if (!el) return;
      el.textContent = '👍';
      el.className = 'feedback-fx feedback-fx--ok';
      el.setAttribute('aria-hidden', 'false');
      if (feedbackFxTimer) clearTimeout(feedbackFxTimer);
      feedbackFxTimer = setTimeout(() => {
        el.classList.add('hidden');
        el.setAttribute('aria-hidden', 'true');
        feedbackFxTimer = null;
      }, 900);
    }

    function showLessonCompleteBanner() {
      return new Promise((resolve) => {
        const overlay = document.getElementById('lessonCompleteOverlay');
        if (!overlay) {
          resolve();
          return;
        }
        // restart animation
        const banner = overlay.querySelector('.lesson-complete__banner');
        if (banner) {
          banner.style.animation = 'none';
          void banner.offsetWidth;
          banner.style.animation = '';
        }
        overlay.classList.remove('hidden');
        try { speak('你做到了！'); } catch (_) {}
        setTimeout(() => {
          overlay.classList.add('hidden');
          resolve();
        }, 2800);
      });
    }

    function advanceAfterCorrect(lastQ) {
      messageEl.textContent = '';
      if (state.q < lastQ) {
        state.q++;
      } else {
        state.q = 0;
        state.stars = [];
        if (state.s + 1 < lessons.length) {
          state.s++;
          unlockedLessons[state.m][state.s] = true;
        }
        resetStarsForLesson();
      }
      saveState();
      syncDeepLinkUrl();
      closeMenus();
      renderDropdowns();
      renderQuestion();
    }

    function checkAnswer(parts, expectedChars) {
      const lesson = currentLesson();
      const sentence = lesson.sentences[state.q];
      if (!sentence) return;
      const expected = expectedChars || charsOnly(splitSentence(sentence));
      const ans = placedCharsFromAnswer().join('');
      if (ans === expected) {
        answerEl.innerHTML = '';
        (parts || splitSentence(sentence)).forEach((p) => {
          const li = document.createElement('li');
          li.className = p.type === 'punct' ? 'punct' : 'char';
          if (p.type === 'punct') li.textContent = p.ch;
          else fillCharTile(li, p.ch);
          answerEl.appendChild(li);
        });
        messageEl.style.color = 'green';
        messageEl.textContent = '恭喜正確！';
        state.stars[state.q] = true;
        const lastQ = lesson.sentences.length - 1;
        const lessonDone = state.q === lastQ;
        if (lessonDone && !bypass) {
          if (state.s + 1 < lessons.length) unlockedLessons[state.m][state.s + 1] = true;
        }
        saveState();
        renderStars();
        showThumbsUp();
        if (advanceTimer) clearTimeout(advanceTimer);
        if (lessonDone) {
          advanceTimer = setTimeout(async () => {
            await showLessonCompleteBanner();
            advanceAfterCorrect(lastQ);
          }, 1000);
        } else {
          advanceTimer = setTimeout(() => advanceAfterCorrect(lastQ), 1600);
        }
      } else {
        messageEl.style.color = 'red';
        messageEl.textContent = '❌ 錯誤，請再試一次';
        if (typeof renderQuestion._returnAllCharsToPool === 'function') {
          renderQuestion._returnAllCharsToPool();
        } else {
          Array.from(answerEl.querySelectorAll('li.char')).forEach((li, i) => {
            const ch = li.dataset.ch || li.textContent;
            const num = li.dataset.num || String(i + 1);
            charsEl.appendChild(makePoolTile(ch, num, renderQuestion._pickChar));
          });
          answerEl.innerHTML = '';
        }
      }
    }

    pwdBtn.onclick = () => {
      if (pwdInput.value === 'CREC') {
        bypass = true;
        ensureUnlockGrid();
        unlockedLessons = unlockedLessons.map((row, m) => {
          const n = m === state.m ? Math.max(row.length, lessons.length, 1) : Math.max(row.length, 1);
          return Array.from({ length: n }, () => true);
        });
        saveState();
        renderDropdowns();
        renderQuestion();
      } else {
        alert('密碼錯誤');
      }
      pwdInput.value = '';
    };

    if (fsBtn) {
      fsBtn.onclick = () => toggleFullscreen();
      document.addEventListener('fullscreenchange', updateFsBtn);
      document.addEventListener('webkitfullscreenchange', updateFsBtn);
      updateFsBtn();
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadSavedState();
      const deep = parseDeepLink();
      if (deep) {
        state.m = deep.m;
        if (deep.s != null) state.s = deep.s;
        loadSheet(state.m, state.s, { forceLesson: deep.s != null });
      } else {
        loadSheet(state.m, state.s);
      }
    });

    window.addEventListener('resize', () => {
      const n = charsEl.querySelectorAll('li.char').length + answerEl.querySelectorAll('li.char').length;
      if (n) setCharGridCols(n);
    });
  </script>
</body>
</html>
